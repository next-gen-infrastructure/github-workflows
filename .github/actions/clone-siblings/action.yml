name: Clone sibling packages
description: >
  Clone the `../<sibling-prefix>*` path dependencies of this repo next to the workspace. The set is derived
  from `[tool.uv.sources]` in pyproject.toml, then from each cloned sibling's own pyproject.toml,
  until nothing new appears. Clones the PR base branch, falling back to dev unless `fallback-ref` is empty.

inputs:
  token:
    description: Token with read access to the private sibling repos
    required: true
  base-ref:
    description: Branch to clone from
    default: dev
  fallback-ref:
    description: >
      Branch to clone when a sibling lacks base-ref. Empty means no fallback: a sibling without base-ref
      fails the step (for a build that must never mix in another branch's code).
    default: dev
  sibling-prefix:
    description: Only path dependencies `../<prefix>*` are cloned. Empty clones every `../<name>` dependency.
    default: ''

outputs:
  repos:
    description: The repos this step cloned, separated by spaces
    value: ${{ steps.clone.outputs.repos }}

runs:
  using: composite
  steps:
    - id: clone
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        # Credential helper, so the token never lands in a sibling's .git/config.
        GIT_CONFIG_COUNT: 1
        GIT_CONFIG_KEY_0: credential.https://github.com.helper
        GIT_CONFIG_VALUE_0: '!f() { echo username=x-access-token; echo "password=$GH_TOKEN"; }; f'
        BASE_REF: ${{ inputs.base-ref }}
        FALLBACK_REF: ${{ inputs.fallback-ref }}
        PREFIX: ${{ inputs.sibling-prefix }}
        WORKSPACE: ${{ github.workspace }}
        OWNER: ${{ github.repository_owner }}
      run: |
        set -euo pipefail

        if [[ ! "$PREFIX" =~ ^[A-Za-z0-9._-]*$ || "$PREFIX" == .* ]]; then
          printf '::error::refusing sibling-prefix %q\n' "$PREFIX"; exit 1
        fi

        # `|| true`: a closure leaf has no matches and grep exits 1, which is not an error.
        extract_siblings() {
          { awk '/^\[tool\.uv\.sources\]/{inside=1; next} /^\[/{inside=0} inside' \
              "$1/pyproject.toml" 2>/dev/null \
            | grep -ohE "[\"']\.\./${PREFIX}[A-Za-z0-9][A-Za-z0-9._-]*" | sed -E 's#^.\.\./##' | sort -u; } || true
        }

        clone_repo() {
          local repo="$1"
          local url="https://github.com/${OWNER}/${repo}.git"
          if ! git clone --depth 1 -b "$BASE_REF" "$url" "$repo" 2>/dev/null; then
            if [ -z "$FALLBACK_REF" ]; then
              echo "::error::branch $BASE_REF not in $repo"; return 1
            fi
            echo "branch $BASE_REF not in $repo; falling back to $FALLBACK_REF"
            git clone --depth 1 -b "$FALLBACK_REF" "$url" "$repo"
          fi
        }

        export -f clone_repo

        # One dependency level at a time: its repos are independent, so they clone in parallel, and the
        # next level is read from what this one brought in.
        cd "$WORKSPACE/.."
        frontier="$(extract_siblings "$WORKSPACE")"
        cloned=()
        while [ -n "$frontier" ]; do
          todo=()
          for repo in $frontier; do
            [ -d "$repo" ] || todo+=("$repo")
          done
          if [ ${#todo[@]} -eq 0 ]; then break; fi
          # xargs stops starting clones once one exits 255, and then fails: one failed clone fails the step.
          printf '%s\n' "${todo[@]}" \
            | xargs -P 8 -I{} bash -c 'echo "Cloning sibling: $1"; clone_repo "$1" || exit 255' _ {}
          next=""
          for repo in "${todo[@]}"; do
            cloned+=("$repo")
            next="$next $(extract_siblings "$repo")"
          done
          frontier="$(printf '%s\n' $next | sed '/^$/d' | sort -u | tr '\n' ' ')"
        done

        echo "Resolved sibling closure:"
        find . -maxdepth 1 -type d -name "${PREFIX}*" | sort
        echo "repos=${cloned[*]:-}" >> "$GITHUB_OUTPUT"
