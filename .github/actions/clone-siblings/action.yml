name: Clone sibling packages
description: >
  Clone the sibling repos of this repo next to the workspace, 8 at a time: the ones its project files name
  (today the `../<name>` path dependencies in `[tool.uv.sources]` of pyproject.toml), plus any repos listed in
  `sibling-repos` or `sibling-repos-file`, then the same for each cloned sibling, until nothing new appears.
  With `stage-dir`, also copies them where a docker build takes them from.
  Needs Python 3.11+. The logic is in siblings.py next to this file.

inputs:
  token:
    description: Token with read access to the private sibling repos
    required: true
  base-ref:
    description: Branch to clone from
    default: dev
  fallback-ref:
    description: >
      Branch to clone when a sibling lacks base-ref. Empty means no fallback: a sibling without base-ref
      fails the step (for a build that must never mix in another branch's code).
    default: dev
  sibling-prefix:
    description: Of the siblings the project files name, only those starting with this. Empty takes them all. Listed repos are taken as written.
    default: ''
  sibling-repos:
    description: >
      Repos to clone as well, one per line (`#` starts a comment), for siblings the project files don't name.
      A line may continue with the paths to stage for that repo (`name path path`), replacing stage-files for it.
    default: ''
  sibling-repos-file:
    description: Path in the checkout to a file of repos, one per line, merged with sibling-repos.
    default: ''
  stage-dir:
    description: >
      Copy each cloned sibling to <stage-dir>/<repo>, for a docker build context holding the siblings
      (`COPY --from=<context> / /`). Empty does not stage.
    default: ''
  stage-files:
    description: With stage-dir, the paths kept from each sibling, separated by spaces or newlines. Empty keeps everything but .git.
    default: ''
  source-repo:
    description: >
      With stage-dir, the repo a dispatch came from. When it is one of the siblings, SUBMODULE_SHA=-<its short
      commit> is added to the job environment, for the image tag.
    default: ''

outputs:
  repos:
    description: The repos this step cloned, separated by spaces
    value: ${{ steps.clone.outputs.repos }}

runs:
  using: composite
  steps:
    - id: clone
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        # Credential helper, so the token never lands in a sibling's .git/config.
        GIT_CONFIG_COUNT: 1
        GIT_CONFIG_KEY_0: credential.https://github.com.helper
        GIT_CONFIG_VALUE_0: '!f() { echo username=x-access-token; echo "password=$GH_TOKEN"; }; f'
        BASE_REF: ${{ inputs.base-ref }}
        FALLBACK_REF: ${{ inputs.fallback-ref }}
        PREFIX: ${{ inputs.sibling-prefix }}
        SIBLING_REPOS: ${{ inputs.sibling-repos }}
        SIBLING_REPOS_FILE: ${{ inputs.sibling-repos-file }}
        STAGE_DIR: ${{ inputs.stage-dir }}
        STAGE_FILES: ${{ inputs.stage-files }}
        SOURCE_REPO: ${{ inputs.source-repo }}
        WORKSPACE: ${{ github.workspace }}
        OWNER: ${{ github.repository_owner }}
      run: python3 "$GITHUB_ACTION_PATH/siblings.py"
