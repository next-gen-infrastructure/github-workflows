name: Run pytest
description: >
  Run the suite with `uv run pytest` after `uv sync`: parallel with pytest-xdist, failures re-run serially to
  tell real ones from order-dependent ones, coverage measured. The logic is in run_pytest.py next to this file.
  Reports are left in $RUNNER_TEMP/pytest.

inputs:
  pytest-args:
    description: >
      Arguments for pytest. One argument per line when the value has a newline (so a value with spaces works,
      `-m` and its expression on two lines), otherwise split on spaces.
    default: tests
  workers:
    description: >
      pytest-xdist workers. `auto` is one per CPU of the cgroup quota, at most 8, and runs serially when the
      project lacks pytest-xdist. `0` runs without xdist. A number sets it exactly and needs pytest-xdist.
    default: auto
  coverage-fail-under:
    description: >
      Fail when the line coverage is below this percentage. Empty never fails on coverage. Coverage is measured
      when the project has pytest-cov, and skipped with a notice when it does not.
    default: ''
  min-passed:
    description: Fail when fewer tests passed, so a suite that silently stopped running is red. 0 disables it.
    default: '0'

outputs:
  passed:
    description: Number of tests that passed on this branch
    value: ${{ steps.pytest.outputs.passed }}

runs:
  using: composite
  steps:
    - id: pytest
      shell: bash
      env:
        PYTEST_ARGS: ${{ inputs.pytest-args }}
        WORKERS: ${{ inputs.workers }}
        COV_FAIL_UNDER: ${{ inputs.coverage-fail-under }}
        MIN_PASSED: ${{ inputs.min-passed }}
      run: uv run --no-project --quiet python "$GITHUB_ACTION_PATH/run_pytest.py"
