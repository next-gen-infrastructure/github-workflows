name: Python dev tag

# Tags a change that reached dev as a release candidate vX.Y.ZrcN: X.Y.Z is the next patch after
# the latest final release (0.1.0 before the first one), N is the next free number. The version
# is derived from the tag by hatch-vcs. Candidates fall under the v*rc* exclusion of the
# release-tags-immutable ruleset.
#
# Needs the README's "Release convention": the package version comes from git tags (hatch-vcs).
#
# The caller owns the triggers, the `concurrency` group (serialises tag numbering) and the test
# gate: a local `./` workflow path would resolve in the caller's checkout, so run
# `uses: ./.github/workflows/test.yml` in a job this one `needs`.

on:
  workflow_call:
    inputs:
      runs-on:
        type: string
        default: ubuntu-latest
        description: Runner label
    secrets:
      RELEASE_APP_ID:
        required: true
      RELEASE_APP_PRIVATE_KEY:
        required: true

permissions:
  contents: read

jobs:
  dev-tag:
    if: github.ref == 'refs/heads/dev'
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/create-github-app-token@v3
        id: app
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      # Credentials stay: the job pushes the tag with them and uploads no artifacts.
      - uses: actions/checkout@v7 # zizmor: ignore[artipacked]
        with:
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}

      - name: Next candidate version
        id: version
        run: |
          set -euo pipefail
          if git tag --points-at HEAD | grep -q '^v'; then
            echo "HEAD is already tagged: $(git tag --points-at HEAD | tr '\n' ' ')"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last=$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)
          if [ -z "$last" ]; then
            next=0.1.0
          else
            IFS=. read -r x y z <<< "${last#v}"
            next="$x.$y.$((z + 1))"
          fi
          n=$(git tag -l "v${next}rc*" | sed -nE 's/.*rc([0-9]+)$/\1/p' | sort -n | tail -1)
          echo "VERSION=${next}rc$(( ${n:-0} + 1 ))" >> "$GITHUB_ENV"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: steps.version.outputs.skip != 'true'

      - name: Tag locally so hatch-vcs derives the version, then build
        if: steps.version.outputs.skip != 'true'
        run: |
          set -euo pipefail
          git config user.name "release-bot"
          git config user.email "release-bot@users.noreply.github.com"
          git tag -a "v$VERSION" -m "Release candidate v$VERSION"
          uv build
          compgen -G "dist/*-$VERSION-*.whl" || { echo "wheel does not carry $VERSION"; ls dist; exit 1; }

      - name: Push the tag as the App
        if: steps.version.outputs.skip != 'true'
        run: git push origin "refs/tags/v$VERSION"
