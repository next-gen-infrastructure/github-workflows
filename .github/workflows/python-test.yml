name: Python tests

# The caller owns the triggers and the `concurrency` group.

on:
  workflow_call:
    inputs:
      runs-on:
        type: string
        default: ubuntu-latest
        description: Runner label. `uv sync` over a large sibling closure needs about 8Gi of memory.
      pytest-args:
        type: string
        default: tests/unit
        description: >
          Arguments for `uv run pytest`. One argument per line when the value has a newline, so a value
          with spaces works (`-m` and its expression on two lines); otherwise split on spaces, e.g.
          `tests --ignore=tests/integration`. Leave out `-n` and `--cov*`: the workflow sets them.
      workers:
        type: string
        default: auto
        description: >
          pytest-xdist workers. `auto` is one per CPU of the job's cgroup quota, at most 8, and runs serially
          when the project lacks pytest-xdist. `0` runs without xdist. A number sets it exactly.
      coverage:
        type: boolean
        default: true
        description: Measure line coverage and report it in the job summary (needs pytest-cov in the project)
      coverage-fail-under:
        type: string
        default: ""
        description: Fail when the line coverage is below this percentage, e.g. 85. Empty never fails on coverage.
      uv-sync-args:
        type: string
        default: --frozen --all-extras
        description: >
          Arguments for `uv sync`. --all-extras is a workaround for modules that still declare
          pytest under optional-dependencies instead of dependency-groups (OSI-3181).
      python-version:
        type: string
        default: ""
        description: Python for uv, e.g. 3.12. Empty lets uv choose.
      min-passed:
        type: number
        default: 0
        description: Fail when fewer tests passed, so a suite that silently stopped running is red. 0 disables it.
      free-disk-space:
        type: boolean
        default: false
        description: Free runner disk first, for large sibling closures
      artifact-paths:
        type: string
        default: ""
        description: Newline-separated paths uploaded with the test log and the coverage report as the `python-test-artifacts` artifact, even when the tests fail
      timeout-minutes:
        type: number
        default: 360
        description: Job timeout (360 is GitHub's default)
      persist-credentials:
        type: boolean
        default: false
        description: Keep the checkout token in git config. Set true only when the tests push.
      base-ref:
        type: string
        default: ""
        description: Branch to clone siblings from. Empty uses the PR base, or dev on a push.
      sibling-prefix:
        type: string
        default: ""
        description: Clone only path dependencies named `../<prefix>*`. Empty clones every `../<name>` dependency.
      pre-test-script:
        type: string
        default: ""
        description: >
          Path in the checkout to a bash script run after `uv sync` and before the tests, with
          the siblings cloned and git credentials for private repos set. Fails the job if it exits non-zero.
    secrets:
      DEPS_READER_APP_ID:
        required: true
      DEPS_READER_PRIVATE_KEY:
        required: true
    outputs:
      passed:
        description: Number of tests that passed on this branch
        value: ${{ jobs.test.outputs.passed }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    outputs:
      passed: ${{ steps.tests.outputs.passed }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: ${{ inputs.persist-credentials }}

      - name: Free disk space
        if: inputs.free-disk-space
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          android: true
          swap-storage: true
          dotnet: false
          haskell: false
          large-packages: false
          docker-images: false

      - name: Read token for private sibling repos
        id: deps-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.DEPS_READER_APP_ID }}
          private-key: ${{ secrets.DEPS_READER_PRIVATE_KEY }}
          # Owner-wide: the sibling closure and uv's git sources are only known at run time.
          owner: ${{ github.repository_owner }} # zizmor: ignore[github-app]
          permission-contents: read

      # Not `./`: a local path would resolve in the caller's checkout. release-please bumps the major.
      - uses: next-gen-infrastructure/github-workflows/.github/actions/clone-siblings@v1 # x-release-please-major
        with:
          token: ${{ steps.deps-token.outputs.token }}
          base-ref: ${{ inputs.base-ref || github.base_ref || 'dev' }}
          sibling-prefix: ${{ inputs.sibling-prefix }}

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      # Self-hosted runners can keep uv's default cache (~/.cache/uv) on another filesystem than the
      # workspace. uv then cannot hardlink and copies every package: 28s instead of 1s for 82 packages.
      # The runner temp dir is on the workspace's filesystem. Keeps a cache dir setup-uv already set.
      - name: Keep the uv cache on the workspace filesystem
        run: '[ -n "${UV_CACHE_DIR:-}" ] || echo "UV_CACHE_DIR=$RUNNER_TEMP/uv-cache" >> "$GITHUB_ENV"'

      - name: Pin Python
        if: inputs.python-version != ''
        env:
          PYTHON_VERSION: ${{ inputs.python-version }}
        run: echo "UV_PYTHON=$PYTHON_VERSION" >> "$GITHUB_ENV"

      - name: Install dependencies
        env:
          # Private git sources. Not exported to later steps: the tests must not see the token.
          GH_TOKEN: ${{ steps.deps-token.outputs.token }}
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: credential.https://github.com.helper
          GIT_CONFIG_VALUE_0: '!f() { echo username=x-access-token; echo "password=$GH_TOKEN"; }; f'
          UV_SYNC_ARGS: ${{ inputs.uv-sync-args }}
        run: |
          read -ra sync_args <<<"$UV_SYNC_ARGS"
          uv sync "${sync_args[@]}"

      - name: Pre-test script
        if: inputs.pre-test-script != ''
        env:
          # Private git sources. Not exported to later steps: the tests must not see the token.
          GH_TOKEN: ${{ steps.deps-token.outputs.token }}
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: credential.https://github.com.helper
          GIT_CONFIG_VALUE_0: '!f() { echo username=x-access-token; echo "password=$GH_TOKEN"; }; f'
          SCRIPT: ${{ inputs.pre-test-script }}
        run: |
          set -euo pipefail
          [ -f "$SCRIPT" ] || { printf '::error::pre-test-script %q not found\n' "$SCRIPT"; exit 1; }
          bash "$SCRIPT"

      # No continue-on-error: a red repo must be red. Not `./`: a local path would resolve in the caller's
      # checkout. release-please bumps the major.
      - name: Tests
        id: tests
        uses: next-gen-infrastructure/github-workflows/.github/actions/run-pytest@v1 # x-release-please-major
        with:
          pytest-args: ${{ inputs.pytest-args }}
          workers: ${{ inputs.workers }}
          coverage: ${{ inputs.coverage }}
          coverage-fail-under: ${{ inputs.coverage-fail-under }}
          min-passed: ${{ inputs.min-passed }}

      # The test log and the coverage report, plus the caller's paths, also when the tests fail.
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: python-test-artifacts
          path: |
            ${{ runner.temp }}/pytest/head.log
            ${{ runner.temp }}/pytest/coverage.json
            ${{ inputs.artifact-paths }}
          retention-days: 14
          if-no-files-found: warn
