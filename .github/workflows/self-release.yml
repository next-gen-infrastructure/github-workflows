name: release-please

on:
  push:
    branches:
      - main

env:
  CLIENT_ID: ${{ vars.RELEASE_PLEASE_CLIENT_ID }}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      major: ${{ steps.release.outputs.major }}
    steps:
      - id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ env.CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write # release-please labels its PRs
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}

  # Callers pin @v1: move the major tag to every new release of that major.
  major-tag:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ env.CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_PRIVATE_KEY }}
          permission-contents: write
          # Every commit here touches .github/workflows, and a ref push of one needs this.
          permission-workflows: write

      # Credentials stay: the job pushes the tag with them and uploads no artifacts.
      - uses: actions/checkout@v7 # zizmor: ignore[artipacked]
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Move the major tag
        env:
          MAJOR: ${{ needs.release-please.outputs.major }}
        run: |
          set -euo pipefail
          [[ "$MAJOR" =~ ^[0-9]+$ ]] || { echo "::error::no major version from release-please"; exit 1; }
          git tag -f "v$MAJOR"
          git push -f origin "refs/tags/v$MAJOR"
